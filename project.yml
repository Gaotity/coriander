name: Coriander
options:
  bundleIdPrefix: com.gaotity
targets:
  Coriander:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: src/App
      - path: src/Engine
      - path: vendor/rime-baseline
        type: folder
    info:
      path: src/App/Info.plist
      properties:
        CFBundleName: Coriander
        CFBundleDisplayName: Coriander
        UILaunchScreen_Generation: YES
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: src/App/Coriander.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gaotity.coriander
    dependencies:
      - target: CorianderKeyboard
    settings:
      base: &rimeSettings
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 977W8XTYW6
        RIME_XCF: "$(SRCROOT)/.scratch/librime-deps/Rime.xcframework"
        SWIFT_INCLUDE_PATHS[sdk=iphoneos*]: "$(inherited) $(RIME_XCF)/ios-arm64/Headers"
        SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]: "$(inherited) $(RIME_XCF)/ios-arm64_x86_64-simulator/Headers"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(RIME_XCF)/ios-arm64"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(inherited) $(RIME_XCF)/ios-arm64_x86_64-simulator"
        OTHER_LDFLAGS: "$(inherited) -lrime-combined -lc++"
        PRODUCT_BUNDLE_IDENTIFIER: com.gaotity.coriander
  CorianderKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: src/Keyboard
      - path: src/Engine
    info:
      path: src/Keyboard/Info.plist
      properties:
        CFBundleName: CorianderKeyboard
        CFBundleDisplayName: Coriander
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: NO
            PrefersRightToLeft: NO
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: YES
    entitlements:
      path: src/Keyboard/CorianderKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gaotity.coriander
    settings:
      base:
        << : *rimeSettings
        PRODUCT_BUNDLE_IDENTIFIER: com.gaotity.coriander.keyboard
  CorianderEngineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: src/Engine
      - path: tests/EngineTests
      - path: vendor/rime-baseline
        type: folder
    info:
      path: tests/EngineTests/Info.plist
      properties:
        CFBundleName: CorianderEngineTests
    settings:
      base:
        << : *rimeSettings
        PRODUCT_BUNDLE_IDENTIFIER: com.gaotity.coriander.engine-tests
  CorianderLifecycleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: src/Engine
      - path: tests/LifecycleTests
      - path: vendor/rime-baseline
        type: folder
    info:
      path: tests/LifecycleTests/Info.plist
      properties:
        CFBundleName: CorianderLifecycleTests
    settings:
      base:
        << : *rimeSettings
        PRODUCT_BUNDLE_IDENTIFIER: com.gaotity.coriander.lifecycle-tests
  CorianderProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: tests/ProbeUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 977W8XTYW6
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaotity.coriander.probe-uitests
        TEST_TARGET_NAME: Coriander
schemes:
  Coriander:
    build:
      targets:
        Coriander: all
        CorianderKeyboard: all
        CorianderEngineTests: [test]
        CorianderLifecycleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorianderEngineTests
        - CorianderLifecycleTests
        - CorianderProbeUITests
