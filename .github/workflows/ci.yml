# Ticket 11 — CI pipeline.
# Frugal by design: the XCFramework is cached keyed by the pinned librime
# version and the build scripts (rebuilt only when they change), and only
# code or CI configuration changes trigger a run — docs-only changes do not.
name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'trunk-merge/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/**'
      - '.trunk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The Xcode build needs only Rime.xcframework (RIME_XCF in project.yml).
      # The librime pin lives in scripts/librime/*.sh, so their hash keys the
      # cache; any pin or script change forces a rebuild.
      - name: Cache Rime.xcframework
        id: rime-cache
        uses: actions/cache@v6
        with:
          path: .scratch/librime-deps/Rime.xcframework
          key: rime-xcframework-${{ hashFiles('scripts/librime/fetch.sh', 'scripts/librime/build-deps.sh', 'scripts/librime/build-librime.sh') }}

      # xcodegen is needed on every run: Coriander.xcodeproj is generated, not
      # committed.
      - name: Install xcodegen
        run: brew install xcodegen

      # cmake, ninja, and bash are only for the librime rebuild below. The
      # runner ships bash 3.2 only, but the scripts need bash 4+ (associative
      # arrays), so install bash and invoke the scripts with it explicitly.
      - name: Install dep-build tools
        if: steps.rime-cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja bash

      - name: Build librime XCFramework
        if: steps.rime-cache.outputs.cache-hit != 'true'
        run: |
          BASH="$(brew --prefix)/bin/bash"
          "$BASH" scripts/librime/fetch.sh
          "$BASH" scripts/librime/build-deps.sh
          "$BASH" scripts/librime/build-librime.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # `macos-latest` is a moving label and its simulator set churns (a
      # pinned device name broke this workflow overnight), so resolve any
      # available iPhone from the newest runtime instead of naming one.
      - name: Resolve an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid']); break
              else:
                  continue
              break
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: xcodebuild test -scheme Coriander -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
