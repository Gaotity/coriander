# Ticket 11 — CI pipeline.
# Frugal by design: the XCFramework is cached keyed by the pinned librime
# version and the build scripts (rebuilt only when they change), and only
# code-path changes trigger a run — docs-only changes do not.
name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The Xcode build needs only Rime.xcframework (RIME_XCF in project.yml).
      # The librime pin lives in scripts/librime/*.sh, so their hash keys the
      # cache; any pin or script change forces a rebuild.
      - name: Cache Rime.xcframework
        id: rime-cache
        uses: actions/cache@v6
        with:
          path: .scratch/librime-deps/Rime.xcframework
          key: rime-xcframework-${{ hashFiles('scripts/librime/fetch.sh', 'scripts/librime/build-deps.sh', 'scripts/librime/build-librime.sh') }}

      # xcodegen is needed on every run: Coriander.xcodeproj is generated, not
      # committed. cmake and ninja are only for the librime rebuild below.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install dep-build tools
        if: steps.rime-cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Build librime XCFramework
        if: steps.rime-cache.outputs.cache-hit != 'true'
        run: |
          scripts/librime/fetch.sh
          scripts/librime/build-deps.sh
          scripts/librime/build-librime.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: xcodebuild test -scheme Coriander -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
